[package]
name = "wonderland"
version = "0.7.0"
edition = "2021"
default-run = "wonderland"
description = "Wonderland: a production-minded Rust AI agent foundation with memory, collaboration, planning and evaluation"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
regex = "1.13.1"
globset = "0.4.20"
ignore = "0.4.33"
url = "2.5"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
futures-util = "0.3.34"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
portable-pty = "0.9"
vt100 = "0.16.2"
rfd = "0.15"

[features]
ui-snapshots = ["dep:image"]

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
