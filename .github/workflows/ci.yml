name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets --features ui-snapshots
      - run: npm test --prefix packaging/npm/wonderland-cli
  unix-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        # rfd uses xdg-portal + async-std (pure Rust D-Bus); GTK development
        # packages are unnecessary. Native PTYs use libc and need no display.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo check --locked --all-targets --features ui-snapshots
      - name: Headless desktop bridge, workspace and native PTY tests
        run: cargo test --locked --lib desktop_
      - name: Collaboration state, verification and Git isolation tests
        run: |
          cargo test --locked --lib team_
          cargo test --locked --lib workflow::tests
          cargo test --locked --lib workbench_service::tests
      - name: Official tool adapters and local installation diagnostics
        run: |
          cargo test --locked --lib native_executor
          cargo test --locked --lib app_diagnostics
